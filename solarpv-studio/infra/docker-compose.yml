version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:2.15.2-pg16
    container_name: solarpv-postgres
    environment:
      POSTGRES_DB: solarpv_db
      POSTGRES_USER: solarpv_user
      POSTGRES_PASSWORD: solarpv_password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init_postgres.sql
      - ./timescale/init.sql:/docker-entrypoint-initdb.d/02_init_timescale.sql

  redis:
    image: redis:7-alpine
    container_name: solarpv-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: solarpv-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=solarpv_db;Username=solarpv_user;Password=solarpv_password
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      - postgres
      - redis

  scraper-service:
    build:
      context: ../src/scraper-service
      dockerfile: Dockerfile
    container_name: solarpv-scraper
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_BASE_URL=http://api:8080
    depends_on:
      - redis
      - api
