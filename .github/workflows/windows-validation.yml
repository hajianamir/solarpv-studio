name: Windows Operational Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    name: Windows 2022 · Node 22
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright-core install chromium

      - name: Type checks and lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Engineering calculations and core regressions
        run: npm test

      - name: User-flow smoke tests
        run: npm run test:smoke

      - name: Data gateway regressions
        run: npm run test:gateway

      - name: Real browser and offline workflow regressions
        run: npm run test:browser

      - name: DOCX/XLSX/JSON export read-back
        run: npm run verify:exports

      - name: Audit remediation verification
        run: npm run test:remediation

      - name: Engineering audit suites
        run: npm run test:audit
