name: F0 F1 foundation acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'services/**', 'sdk/**', 'scripts/**', 'package*.json', 'vite.config.ts', 'docs/reference-data/**', 'docs/examples/references/**', '.github/workflows/foundation-acceptance.yml']
  push:
    paths: ['src/**', 'services/**', 'sdk/**', 'scripts/**', 'package*.json', 'vite.config.ts', 'docs/reference-data/**', 'docs/examples/references/**', '.github/workflows/foundation-acceptance.yml']
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REAL_INTERNET: 'false'
      VITE_REAL_INTERNET: 'false'
      PVLIB_PYTHON: python
      PVLIB_REFERENCE_PYTHON: .cache/reference-env/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r services/pvlib_research/requirements-science-b.txt
      - name: Build and smoke-test installable SDK
        run: |
          python -m pip wheel --no-deps ./sdk -w .cache/sdk-wheels
          python -m pip install --no-deps ./sdk
          python -I -c "from solarpv_sdk import Client; print('SDK installed import PASS')"
      - name: Install isolated pinned reference engines
        run: |
          python -m venv .cache/reference-env
          .cache/reference-env/bin/python -m pip install -r services/pvlib_research/requirements-references.txt
      - run: npm run verify:references
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-software-evidence-linux
          path: |
            docs/audit/F0-F1-GATE.json
            docs/audit/A1-A3-GATE.json
            docs/audit/B1-B3-GATE.json
            docs/audit/C1-C3-KERNEL-GATE.json
            docs/audit/D1-D3-GATE.json
            docs/audit/A1-D3-REMAINING-GATE.json
            docs/audit/REFERENCE-MODELS-GATE.json
            docs/audit/UQ-*-GATE.json
            docs/audit/UQ-004-E2E.json
