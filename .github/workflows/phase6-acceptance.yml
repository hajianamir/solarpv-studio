name: Phase 6 security and exact-SHA acceptance
on:
  workflow_dispatch:
  push:
    branches: ['arena/237e6ea2-solarpv-studio']
permissions:
  contents: read
jobs:
  verify:
    name: 'Phase6 / ${{ matrix.os }}'
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PVLIB_PYTHON: python
      OPENBLAS_NUM_THREADS: '1'
      SOLARPV_DB_FILE: .cache/phase6/ci-db.json
      PYBAMM_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: node scripts/ci-command.mjs npm ci
      - run: python -m pip install -r services/pvlib_research/requirements.txt
      - name: npm advisory gate (all locked packages)
        run: npm audit --audit-level=low
      - name: Python advisory gate
        run: |
          python -m venv .cache/audit-env
          node scripts/phase6-python-audit.mjs
      - name: License inventory (NOT distribution clearance)
        run: |
          node scripts/phase6-license-inventory.mjs
          python scripts/phase6-license-inventory.py
      - run: npm run lint
      - run: node scripts/ci-command.mjs npx tsx scripts/test-phase6-security.ts
      - run: node scripts/ci-command.mjs npm run test:research:api
      - run: node scripts/ci-command.mjs npm run test:physical:api
      - run: python -m scripts.test_physical_models
      - run: python -m scripts.test_physical_mutations
      - run: python -m unittest discover -s services/pvlib_research/tests
      - run: python -m unittest discover -s services/pvlib_study/tests
      - run: node scripts/ci-command.mjs npm run test:all
      - run: npm run build
      - name: Locate Windows system Chromium
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $browser = @('C:\Program Files\Google\Chrome\Application\chrome.exe', 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe', 'C:\Program Files\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'No system Chromium found' }
          "BROWSER_EXECUTABLE_PATH=$browser" >> $env:GITHUB_ENV
      - name: Install Linux Chromium libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnspr4 libnss3
      - run: node scripts/ci-command.mjs npm run test:physical:browser
      - name: Record exact checkout and distinguish technical success from release acceptance
        if: always()
        env:
          TECHNICAL_STATUS: '${{ job.status }}'
        run: node scripts/phase6-ci-receipt.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'phase6-${{ matrix.os }}-${{ github.sha }}'
          path: .cache/phase6/
          include-hidden-files: true
          retention-days: 30
