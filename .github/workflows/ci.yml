name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Validate SolarPV Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Benchmark Test Suite
        run: npm test

      - name: Smoke Test (5 end-to-end flows)
        run: npm run test:smoke

      - name: Run Engineering Audit Remediation Tests (R01-R07, R08-R13, Areas 1-10)
        run: npm run test:audit
