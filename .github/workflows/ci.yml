name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  physics-model-registry-gate:
    name: Physics Registry & Independent Reference Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify model registry contract and implementation metadata
        run: npm run verify:physics-registry
      - name: Require independent reference fixtures for every changed formula expression
        run: npx tsx scripts/verify-physics-reference-gate.ts
        env:
          PHYSICS_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      - name: Verify public API client rate-limit contract
        run: npm run verify:rate-limit
      - name: Verify browser-safe source invariants
        run: npm run verify:source-invariants
      - name: Verify engineering compliance claims stay screening-only
        run: npm run verify:engine-claims

  build-and-test:
    name: Build and Validate SolarPV Studio (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Benchmark Test Suite
        run: npm test

      - name: Smoke Test (5 end-to-end flows)
        run: npm run test:smoke

      - name: Provider Gateway Regression Tests
        run: npm run test:gateway

      - name: Install Chromium Runtime Libraries
        run: sudo apt-get update && sudo apt-get install -y libnspr4 libnss3

      - name: Real Browser Regressions (cold offline)
        run: npm run test:browser
        env:
          BROWSER_TEST_TIMEOUT_MS: 360000

      - name: Binary Export Read-back (DOCX/XLSX/JSON)
        run: npm run verify:exports

      - name: Run Audit Remediation Verification Suite
        run: npm run test:remediation

      - name: Run Engineering Audit Remediation Tests (R01-R07, R08-R13, Areas 1-10)
        run: npm run test:audit

  windows-operational-validation:
    name: Windows operational validation (Node 22)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright-core install chromium

      - name: Type checks and lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Engineering calculations and core regressions
        run: npm test

      - name: User-flow smoke tests
        run: npm run test:smoke

      - name: Data gateway regressions
        run: npm run test:gateway

      - name: Real browser and offline workflow regressions
        run: npm run test:browser
        env:
          BROWSER_TEST_TIMEOUT_MS: 360000

      - name: DOCX/XLSX/JSON export read-back
        run: npm run verify:exports

      - name: Audit remediation verification
        run: npm run test:remediation

      - name: Engineering audit R01-R07
        run: npx tsx scripts/audit-r1-to-r7-remediation-test.ts

      - name: Engineering audit Areas 1-10
        run: npx tsx scripts/engineering-audit-remediation-test.ts

      - name: Engineering audit M01-M22
        run: npx tsx scripts/audit-m01-to-m22-remediation-test.ts

      - name: Engineering phase audit
        run: npx tsx scripts/verify-all-phases-audit.ts

      - name: API sizing and thermal audit
        run: npx tsx scripts/verify-api-sizing-thermal-audit.ts

      - name: F-04 energy contract
        run: npm run verify:f04

      - name: Geocode cache regressions
        run: npx tsx scripts/test-geocode-cache.ts

  direct-pvlib-study:
    name: Direct pvlib study (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/pvlib_study/requirements.txt
      - run: npm ci
      - run: python -m pip install -r services/pvlib_research/requirements.txt
      - name: Operational annual energy and import-cost finance bridge
        run: npm run test:operational:energy
      - name: Research editor API integration and process bounds
        run: npm run test:research:api
      - name: Isolated research equations, bounded composition and failure regressions
        run: python -m unittest discover -s services/pvlib_research/tests -v
      - name: Stage55 dual-language composition, archive and migration gates
        run: node scripts/ci-command.mjs npx tsx scripts/test-integrated-study.ts
      - name: Independent equations, published examples and ModelChain cross-check
        run: npm run test:study:python
      - name: Real HTTP, authentication, Python execution and resource/failure limits
        run: npm run test:study && npm run test:study:workflow
      - name: Build offline frontend
        run: npm run build
        env:
          VITE_REAL_INTERNET: 'false'
      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: npx playwright-core install chromium
      - name: Install Chromium shared libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnspr4 libnss3
      - name: Browser import, real Python study, reports and screening isolation
        run: node scripts/ci-command.mjs npm run test:study:browser
      - name: Stage55 real-browser contract and portable archive
        run: npx tsx scripts/test-integrated-browser.ts
      - name: Operational App source adoption and financial UI
        run: npm run test:operational:browser
      - name: Research editor real browser
        run: npm run test:research:browser
      - name: Preserve bounded contract/runtime classification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-contract-evidence-${{ matrix.os }}
          path: |
            .cache/study-evidence/contract-matrix-v2.json
            .cache/study-evidence/integrated-matrix-v1.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
